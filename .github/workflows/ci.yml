name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-build-${{ hashFiles('**/Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --verbose

      - name: Test all targets and features
        run: cargo test --all-targets --all-features --verbose

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build (no-default-features, library only)
        run: cargo build --no-default-features --features "lang-all"

      - name: Documentation
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  features:
    name: Feature ${{ matrix.feature }}
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        feature:
          - lang-c
          - lang-cpp
          - lang-csharp
          - lang-go
          - lang-js
          - lang-python
          - lang-rust
          - serde
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --no-default-features --features "${{ matrix.feature }}"
      - run: cargo test --no-default-features --features "${{ matrix.feature }}" --lib

  minimal:
    name: Minimal library
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --no-default-features --lib

  fuzz:
    name: Fuzz (crash / hang hunting)
    runs-on: ubuntu-latest
    # Fuzzing needs nightly + cargo-fuzz; never block the main pipeline on it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly + cargo-fuzz
        uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz

      - name: Fuzz all parsers briefly
        working-directory: tests/fuzz
        run: cargo fuzz run fuzz_all -- -max_total_time=60
