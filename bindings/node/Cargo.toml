[package]
name = "ripex-node"
version = "0.3.0"
edition = "2021"
rust-version = "1.88.0"
license = "MIT"

[lib]
name = "ripex_node"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.0", features = ["async", "serde-json"] }
napi-derive = "3.6.2"
ripex = { path = "../..", default-features = false, features = ["lang-all", "serde"] }

[build-dependencies]
napi-build = "2.4.0"
