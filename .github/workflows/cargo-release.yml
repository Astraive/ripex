name: Cargo Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the leading v)"
        required: true
        default: "0.3.1"
        type: string
      dry_run:
        description: "Run dry-run only (do not upload to crates.io)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

concurrency:
  group: cargo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Cargo release version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install Rust 1.85.0
        # dtolnay/rust-toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt

      - name: Validate version matches Cargo.toml
        env:
          RELEASE_VERSION_INPUT: ${{ env.RELEASE_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${RELEASE_VERSION_INPUT#v}"
          [[ "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release version must be a semantic X.Y.Z value: $expected" >&2
            exit 1
          }
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "ripex"))'
          )"
          test "$package_version" = "$expected" || {
            echo "Cargo package version $package_version does not match expected $expected" >&2
            exit 1
          }

      - name: Check package verification dry-run
        run: cargo publish --locked --dry-run

  publish:
    name: Publish to Crates.io
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install Rust 1.85.0
        # dtolnay/rust-toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.0

      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run requested: verifying cargo package without publishing..."
            cargo publish --locked --dry-run
          elif [ -n "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "Publishing ripex to crates.io..."
            if cargo publish --locked; then
              echo "Published successfully!"
            else
              echo "cargo publish returned non-zero, checking if version is already published..."
              if cargo search ripex --limit 1 | grep -q 'ripex = "0.3.1"'; then
                echo "ripex 0.3.1 is already published on crates.io."
              else
                exit 1
              fi
            fi
          else
            echo "::notice::CARGO_REGISTRY_TOKEN secret is not set; skipping automated crates.io publication. Run 'cargo publish --locked' manually or configure the repository secret."
          fi
