[package]
name = "ripex-python"
version = "0.4.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"

[lib]
name = "_ripex"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23.4", features = ["extension-module", "abi3-py38"] }
ripex = { path = "../..", default-features = false, features = ["lang-all", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
