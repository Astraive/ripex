name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      # actions/checkout v7 (reviewed immutable commit)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        # dtolnay/rust-toolchain stable (reviewed immutable commit)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo registry
        # actions/cache v6 (reviewed immutable commit)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-registry-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-registry-

      - name: Cache cargo build
        # actions/cache v6 (reviewed immutable commit)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-build-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-build-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --locked --verbose

      - name: Test all targets and features
        run: cargo test --locked --all-targets --all-features --verbose

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Generate per-language evidence report
        if: runner.os == 'Linux'
        run: cargo run --locked --example evidence_report --all-features -- target/ripex-evidence.md

      - name: Build (no-default-features, library only)
        run: cargo build --locked --no-default-features --features "lang-all"

      - name: Documentation
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

  features:
    name: Feature ${{ matrix.feature }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        feature:
          - cli
          - lang-all
          - lang-c
          - lang-cpp
          - lang-csharp
          - lang-go
          - lang-js
          - lang-python
          - lang-rust
          - serde
    steps:
      # actions/checkout v7 (reviewed immutable commit)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        # dtolnay/rust-toolchain stable (reviewed immutable commit)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - name: Cache feature build
        # actions/cache v6 (reviewed immutable commit)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.feature }}-cargo-build-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.feature }}-cargo-build-
      - name: Check isolated feature
        run: cargo check --locked --no-default-features --features "${{ matrix.feature }}"
      - name: Run isolated integration tests
        # --tests runs integration targets; feature-gated language tests skip unavailable modules.
        run: cargo test --locked --no-default-features --features "${{ matrix.feature }}" --tests

  minimal:
    name: Minimal library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    steps:
      # actions/checkout v7 (reviewed immutable commit)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        # dtolnay/rust-toolchain stable (reviewed immutable commit)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - run: cargo check --locked --no-default-features --lib

  compiler-conformance:
    name: Compiler conformance corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # actions/checkout v7 (reviewed immutable commit)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        # dtolnay/rust-toolchain stable (reviewed immutable commit)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - name: Install Go
        # actions/setup-go v7 (reviewed immutable commit)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
      - name: Install latest Node.js
        # actions/setup-node v7 (reviewed immutable commit)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: latest
          check-latest: true
      - name: Install latest Python
        # actions/setup-python v7 (reviewed immutable commit)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          check-latest: true
      - name: Install latest .NET
        # actions/setup-dotnet v6 (reviewed immutable commit)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.x'

      - name: Install language analyzers
        run: |
          npm ci --prefix tests/lang-test/javascript
          python -m pip install mypy

      - name: Build ripex
        run: cargo build --locked --all-features

      - name: Check C17 corpus
        run: target/debug/ripex check tests/lang-test/c --lang c --trusted-project
      - name: Check C++20 corpus
        run: target/debug/ripex check tests/lang-test/cpp --lang cpp --trusted-project
      - name: Check C# project
        run: target/debug/ripex check tests/lang-test/csharp --trusted-project
      - name: Check Go project
        run: target/debug/ripex check tests/lang-test/go --trusted-project
      - name: Check JavaScript project
        run: target/debug/ripex check tests/lang-test/javascript/src --lang javascript --trusted-project
      - name: Check TypeScript project
        run: target/debug/ripex check tests/lang-test/javascript/tsconfig.json --trusted-project
      - name: Check strict Python project
        run: target/debug/ripex check tests/lang-test/python/src --lang python --trusted-project
      - name: Check Rust project
        run: target/debug/ripex check tests/lang-test/rust --trusted-project

  fuzz-replay:
    name: Fuzz corpus replay (deterministic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # actions/checkout v7 (reviewed immutable commit)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install nightly Rust
        # dtolnay/rust-toolchain nightly (reviewed immutable commit)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
      - name: Install latest cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Replay committed fuzz seeds
        working-directory: tests/fuzz
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d corpus ]] || ! find corpus -type f -print -quit | grep -q .; then
            echo "::notice::No committed fuzz seeds found; deterministic replay skipped."
            exit 0
          fi
          for target in fuzz_all fuzz_js fuzz_python fuzz_go; do
            corpus_dir="corpus/$target"
            if [[ ! -d "$corpus_dir" ]]; then
              echo "::error::Missing committed corpus directory: $corpus_dir"
              exit 1
            fi
            echo "Replaying $target committed fuzz seeds"
            CARGOFLAGS=--locked cargo +nightly fuzz run --fuzz-dir . "$target" -- -runs=1 -timeout=5 -rss_limit_mb=512 -max_len=4096
          done
  fuzz:
    name: Fuzz (advisory crash / hang hunting)
    needs: fuzz-replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Randomized fuzzing is advisory and must not block ordinary PR validation.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      # actions/checkout v7 (reviewed immutable commit)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install nightly Rust
        # dtolnay/rust-toolchain nightly (reviewed immutable commit)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
      - name: Install latest cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz all parsers briefly
        working-directory: tests/fuzz
        shell: bash
        run: |
          # cargo-fuzz has no --locked flag; CARGOFLAGS locks its inner Cargo invocation.
          CARGOFLAGS=--locked cargo +nightly fuzz run --fuzz-dir . fuzz_all -- -max_total_time=60 -timeout=5 -rss_limit_mb=512 -max_len=4096
  node-bindings:
    name: Node bindings (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: ripex.linux-x64-gnu.node
            cross: "0"
            runtime: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: ripex.linux-arm64-gnu.node
            cross: "1"
            runtime: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: ripex.darwin-x64.node
            cross: "0"
            runtime: true
          - os: macos-14
            target: aarch64-apple-darwin
            binary: ripex.darwin-arm64.node
            cross: "0"
            runtime: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ripex.win32-x64-msvc.node
            cross: "0"
            runtime: true

    steps:
      # actions/checkout v7 (reviewed immutable commit)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install latest Node.js
        # actions/setup-node v7 (reviewed immutable commit)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: latest
          check-latest: true

      - name: Install latest pnpm
        run: npm install --global pnpm@11.20.0

      - name: Install latest Bun
        run: npm install --global bun@1.3.14
      - name: Install Rust 1.88.0 and target
        # dtolnay/rust-toolchain (reviewed immutable commit)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.88.0
          target: ${{ matrix.target }}

      - name: Install Node binding dependencies
        working-directory: bindings/node
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Node binding
        working-directory: bindings/node
        env:
          NAPI_TARGET: ${{ matrix.target }}
          NAPI_CROSS: ${{ matrix.cross }}
        run: npm run build:release

      - name: Verify target binary and package metadata
        working-directory: bindings/node
        env:
          EXPECTED_BINARY: ${{ matrix.binary }}
          EXPECTED_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          node - "$EXPECTED_BINARY" "$EXPECTED_TARGET" <<'NODE'
          const fs = require('node:fs');
          const binary = process.argv[2];
          const target = process.argv[3];
          const binaries = fs.readdirSync('.')
            .filter((entry) => entry.endsWith('.node'))
            .filter((entry) => fs.statSync(entry).isFile())
            .sort();
          if (binaries.length !== 1 || binaries[0] !== binary) {
            throw new Error(`expected exactly ${binary}, found ${binaries.join(', ')}`);
          }
          const metadata = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const targets = metadata.napi?.targets;
          if (!Array.isArray(targets) || targets.length !== 5 || !targets.includes(target)) {
            throw new Error(`package.json does not declare target ${target}`);
          }
          if (metadata.scripts?.postinstall) {
            throw new Error('postinstall network/download hooks are forbidden');
          }
          NODE

      - name: Run native Node binding tests
        if: matrix.runtime == true
        working-directory: bindings/node
        run: npm test

      - name: Run Bun native smoke test
        if: matrix.runtime == true
        working-directory: bindings/node
        run: bun test test/index.bun.test.mjs
      - name: Check public TypeScript declarations
        if: matrix.runtime == true
        working-directory: bindings/node
        run: npm run test:types

      - name: Check package contents
        if: matrix.runtime == true
        working-directory: bindings/node
        run: npm run pack:dry

      - name: Upload Node binding artifact
        # actions/upload-artifact v7 (immutable commit)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-bindings-${{ matrix.target }}
          path: |
            bindings/node/${{ matrix.binary }}
            bindings/node/index.cjs
            bindings/node/index.js
            bindings/node/index.d.ts
          if-no-files-found: error
          retention-days: 7
