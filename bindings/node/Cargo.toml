[package]
name = "ripex-node"
version = "0.4.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"

[lib]
name = "ripex_node"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.16", features = ["async", "serde-json"] }
napi-derive = "2.16.13"
ripex = { path = "../..", default-features = false, features = ["lang-all", "serde"] }

[build-dependencies]
napi-build = "2.1.4"
