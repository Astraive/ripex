[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "ripex"
version = "0.4.0"
description = "Native multi-language structural parsing and fact extraction for Python."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Neeraj Sathish Kumar", email = "neerajcodz@gmail.com" }
]
keywords = ["parsing", "ast", "fact-extraction", "tree-sitter", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Code Generators",
]

[tool.maturin]
module-name = "ripex._ripex"
python-source = "python"
features = ["pyo3/extension-module", "pyo3/abi3-py38"]
include = ["python/ripex/py.typed", "python/ripex/_ripex.pyi"]
